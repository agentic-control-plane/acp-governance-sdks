[project]
name = "acp-starter-langgraph"
version = "0.0.2"
description = "Minimal ACP-governed agent starter using LangChain 1.x middleware + LangGraph."
requires-python = ">=3.10"
dependencies = [
    "acp-langchain",
    "langchain>=1.3.3",
    "langgraph>=1.0.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
acp-langchain = { path = "../../../python/acp-langchain", editable = true }
