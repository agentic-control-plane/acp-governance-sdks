[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-langchain"
version = "0.2.0"
description = "Agentic Control Plane policy & audit for LangChain / LangGraph agents. One ACPMiddleware() on create_agent; ACP decides allow/deny/redact on every tool call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Crowe" }]
keywords = ["agentic-control-plane", "acp", "langchain", "langgraph", "agent-governance", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "acp-governance>=0.1.0",
]

[project.optional-dependencies]
middleware = ["langchain>=1.3.3"]
dev = ["langchain>=1.3.3", "langgraph>=1.0.0"]

[project.urls]
Homepage = "https://agenticcontrolplane.com"
Documentation = "https://agenticcontrolplane.com/integrations/langchain"
Source = "https://github.com/davidcrowe/acp-governance-sdks"
Issues = "https://github.com/davidcrowe/acp-governance-sdks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_langchain"]
